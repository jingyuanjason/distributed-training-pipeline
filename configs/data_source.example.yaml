# Data source configuration for DatabasePromptLoader.
#
# Copy this file to `configs/data_source.yaml` and fill in your real
# database credentials. `configs/data_source.yaml` is gitignored so
# credentials are never committed.

database:
  host: localhost        # database host
  port: 5432             # database port
  dbname: training_db    # database name
  user: training_db_user         # database user
  password: trainingpassword    # database password
  sslmode: prefer        # disable | allow | prefer | require | verify-ca | verify-full
  connect_timeout: 10    # seconds

# Prompts are sampled by leasing rows from the rollout_jobs queue; see
# rl/worker_node/sql/batch_sample.sql and rl/worker_node/sql/complete_job.sql.
# Each sampled prompt is returned to the caller as a dict, e.g.:
#   {"job_id": 12, "run_id": "...", "prompt_id": 1, "policy_version": "v1",
#    "status": "leased", "worker_id": "host-1", ..., "prompt_text": "..."}
