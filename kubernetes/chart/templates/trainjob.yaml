{{- $resources := deepCopy .Values.resourcesPerNode -}}
{{- $requests := default (dict) $resources.requests -}}
{{- $limits := default (dict) $resources.limits -}}
{{- $_ := set $requests "nvidia.com/gpu" .Values.gpusPerNode -}}
{{- $_ := set $limits "nvidia.com/gpu" .Values.gpusPerNode -}}
{{- $_ := set $resources "requests" $requests -}}
{{- $_ := set $resources "limits" $limits -}}
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: {{ include "pipeline-training.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  runtimeRef:
    {{- toYaml .Values.runtimeRef | nindent 4 }}
  podTemplateOverrides:
    - targetJobs:
        - name: node
      spec:
        volumes:
          - name: run-config
            configMap:
              name: {{ include "pipeline-training.name" . }}-config
          - name: shared-memory
            emptyDir:
              medium: Memory
              sizeLimit: {{ .Values.sharedMemory.sizeLimit | quote }}
        containers:
          - name: node
            volumeMounts:
              - name: run-config
                mountPath: /app/configs/run_config.yaml
                subPath: run_config.yaml
                readOnly: true
              - name: shared-memory
                mountPath: /dev/shm
  trainer:
    image: {{ required "image is required" .Values.image | quote }}
    numNodes: {{ .Values.numNodes }}
    numProcPerNode: {{ .Values.gpusPerNode }}
    resourcesPerNode:
      {{- toYaml $resources | nindent 6 }}
    {{- if .Values.memlock.enabled }}
    command: ["/bin/bash", "-c"]
    {{- else }}
    command: ["torchrun"]
    {{- end }}
    args:
      {{- if .Values.memlock.enabled }}
      - |
        set -euo pipefail
        if ! ulimit -l unlimited; then
          echo "ERROR: Cannot raise memlock; use the SYS_RESOURCE-enabled training runtime." >&2
          exit 1
        fi
        echo "Training memlock: soft=$(ulimit -Sl) hard=$(ulimit -Hl)"
        exec torchrun "$@"
      - "training-launcher"
      {{- end }}
      - {{ printf "--max-restarts=%v" .Values.runConfig.recovery.max_restarts | quote }}
      - "--module"
      - "distributed_parallel_training_pipelined"
      - "--config-path"
      - "/app/configs/run_config.yaml"
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      {{- if .Values.ncclDebug.enabled }}
      - name: NCCL_DEBUG
        value: {{ .Values.ncclDebug.level | quote }}
      - name: NCCL_DEBUG_SUBSYS
        value: {{ .Values.ncclDebug.subsystems | quote }}
      {{- end }}