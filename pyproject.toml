[project]
name = "pipeline-training"
version = "0.1.0"
description = "Standalone CS336 pipeline training snapshot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch~=2.11.0", "numpy>=2.4", "einops>=0.8", "einx>=0.4",
  "jaxtyping>=0.3", "pyyaml", "modal>=1.4.3", "triton", "tqdm>=4.67",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "implementation"
module-root = ""

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]