[project]
name = "pipeline-training"
version = "0.1.0"
description = "Standalone CS336 pipeline training snapshot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch~=2.11.0", "numpy>=2.4", "einops>=0.8", "einx>=0.4",
  "jaxtyping>=0.3", "pyyaml", "modal>=1.4.3", "triton", "tqdm>=4.67",
]

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["modal_wrapper", "distributed_parallel_training_pipelined"]

[tool.setuptools.packages.find]
where = ["."]
include = ["implementation*", "pipeline*", "configs"]

[tool.setuptools.package-data]
configs = ["*.yaml"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]